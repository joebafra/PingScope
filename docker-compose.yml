# PingScope + optional Caddy (automatic HTTPS with Let's Encrypt).
# Settings come from .env (see .env.example, or run ./install.sh).
services:
  pingscope:
    build: .
    image: pingscope:latest
    container_name: pingscope
    restart: unless-stopped
    # Host networking: PingScope uses the server's own IPv4 and IPv6 connectivity directly.
    network_mode: host
    cap_add: [NET_RAW]
    volumes:
      - ./data:/data
    environment:
      PINGSCOPE_LISTEN: ${PINGSCOPE_LISTEN:-127.0.0.1}
      PINGSCOPE_PORT: ${PINGSCOPE_PORT:-8080}
      TZ: ${TZ:-Europe/Amsterdam}

  # Enabled with COMPOSE_PROFILES=https in .env.
  # Gets a Let's Encrypt certificate for PINGSCOPE_DOMAIN, renews it, and redirects HTTP to HTTPS.
  caddy:
    image: caddy:2.8
    container_name: pingscope-caddy
    profiles: ["https"]
    restart: unless-stopped
    network_mode: host
    depends_on: [pingscope]
    environment:
      PINGSCOPE_DOMAIN: ${PINGSCOPE_DOMAIN:-}
      ACME_OPTION: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      PINGSCOPE_PORT: ${PINGSCOPE_PORT:-8080}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
